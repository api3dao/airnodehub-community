name: Delete preview site

on:
  pull_request_target:
    types: [closed]

concurrency:
  group: pages-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions: {}

jobs:
  cleanup:
    name: Delete preview
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      PREVIEW_PROJECT: airnodehub-community-pr-${{ github.event.pull_request.number }}
    permissions: {}
    steps:
      - name: Delete isolated Pages project
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          [[ "${PR_NUMBER}" =~ ^[0-9]+$ ]]

          response_file="${RUNNER_TEMP}/pages-project-delete.json"
          status="$(curl --silent --show-error --output "${response_file}" --write-out "%{http_code}" \
            --request DELETE \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PREVIEW_PROJECT}")"

          if [[ "${status}" == "200" ]]; then
            jq --exit-status '.success == true' "${response_file}" > /dev/null
          elif [[ "${status}" != "404" ]]; then
            jq '{errors, messages}' "${response_file}"
            exit 1
          fi

  comment:
    name: Mark preview as deleted
    needs: cleanup
    if: needs.cleanup.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Mark preview as deleted
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const marker = '<!-- airnodehub-cloudflare-preview -->';
            const body = [
              marker,
              '### Cloudflare preview',
              '',
              `🗑️ Preview deleted because this pull request was ${context.payload.pull_request.merged ? 'merged' : 'closed'}.`,
            ].join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const previous = comments.find((comment) =>
              comment.user?.login === 'github-actions[bot]' && comment.body?.includes(marker)
            );

            if (previous) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: previous.id,
                body,
              });
            }
